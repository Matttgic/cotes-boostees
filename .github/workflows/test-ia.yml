name: Test de l'IA de règlement

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pari de test (résultat connu)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REGLEMENT_MODELE: ${{ vars.REGLEMENT_MODELE }}
        run: python scripts/test_ia.py | tee resultat.txt
      - name: Résultat dans le résumé
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat resultat.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
