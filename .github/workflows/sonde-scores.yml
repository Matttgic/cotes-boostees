name: Validation du règlement par les scores

# Rejoue les boosts déjà réglés avec les sites de scores et compare les verdicts (aucune écriture dans « donnees »).
# Rapport : branche « rapport-scores » (RAPPORT_SCORES.md). Lancé à la main ou à chaque envoi sur une branche feat/reglement-scores-*.
on:
  workflow_dispatch:
  push:
    branches: ["feat/reglement-scores-*"]

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Branche « donnees » (lecture seule)
        run: |
          git fetch --depth 1 origin donnees
          git worktree add donnees FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances et tests
        run: pip install -r requirements.txt -r requirements-dev.txt && python -m pytest -q

      - name: Validation
        env:
          DONNEES: donnees
          SORTIE: sonde-scores
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: python scripts/valider_scores.py

      - name: Publier le rapport sur la branche « rapport-scores »
        if: always()
        run: |
          [ -d sonde-scores ] || exit 0
          mkdir -p /tmp/sortie && cp -r sonde-scores/. /tmp/sortie/
          echo '{"git": {"deploymentEnabled": false}}' > /tmp/sortie/vercel.json
          git config user.name "sonde-bot"
          git config user.email "sonde-bot@users.noreply.github.com"
          git checkout --orphan rapport-tmp
          git rm -rf --quiet . || true
          cp -r /tmp/sortie/. .
          git add -A
          git commit -q -m "Validation scores $(date -u +%F_%H%M)"
          git push -f origin HEAD:rapport-scores
