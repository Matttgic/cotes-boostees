name: Sonde des sources

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Sonde à lancer (sonde.py, sonde2.py, sonde3.py ou sonde5.py)"
        default: "sonde5.py"
      pulsescore:
        description: "sonde.py : sonder aussi PulseScore (oui/non)"
        default: "non"

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Sonde
        working-directory: scripts
        env:
          PULSESCORE_KEY: ${{ secrets.PULSESCORE_KEY }}
          SONDE_PULSESCORE: ${{ inputs.pulsescore }}
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: python "${{ inputs.script }}"

      - name: Publier les résultats sur la branche « sonde » (en gardant les précédents)
        run: |
          mkdir -p /tmp/sortie
          if git fetch --depth 1 origin sonde 2>/dev/null; then
            git --work-tree=/tmp/sortie checkout FETCH_HEAD -- . || true
          fi
          cp -r scripts/sonde/. /tmp/sortie/
          git config user.name "sonde-bot"
          git config user.email "sonde-bot@users.noreply.github.com"
          git checkout --orphan sonde-tmp
          git rm -rf --quiet .
          cp -r /tmp/sortie/. .
          git add -A
          git commit -m "Résultats de la sonde $(date -u +%F_%H%M)"
          git push -f origin HEAD:sonde
