name: Sonde des sources

on:
  workflow_dispatch:
    inputs:
      pulsescore:
        description: "Sonder aussi PulseScore (oui/non)"
        default: "non"

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Sonde PulseScore + sites
        env:
          PULSESCORE_KEY: ${{ secrets.PULSESCORE_KEY }}
          SONDE_PULSESCORE: ${{ inputs.pulsescore }}
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: python scripts/sonde.py

      - name: Publier les résultats sur la branche « sonde »
        run: |
          cp -r sonde /tmp/sonde
          git config user.name "sonde-bot"
          git config user.email "sonde-bot@users.noreply.github.com"
          git checkout --orphan sonde
          git rm -rf --quiet .
          cp -r /tmp/sonde/. .
          git add -A
          git commit -m "Résultats de la sonde $(date -u +%F_%H%M)"
          git push -f origin sonde
